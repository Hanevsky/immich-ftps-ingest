# Optional: use Docker secrets instead of raw env credentials.
# Create the secret files first:
#   mkdir -p secrets
#   printf 'camera_a7c2:LongRandomSecret!!' > secrets/ftp_users
#   printf 'your_api_key' > secrets/immich_api_key
#
# Then run with:
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d

services:
  sony-ftp:
    environment:
      FTP_USERS_FILE: /run/secrets/ftp_users
    secrets:
      - ftp_users

  immich-importer:
    environment:
      IMMICH_API_KEY_FILE: /run/secrets/immich_api_key
    secrets:
      - immich_api_key

secrets:
  ftp_users:
    file: ./secrets/ftp_users
  immich_api_key:
    file: ./secrets/immich_api_key
