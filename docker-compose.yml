# Immich FTPS ingest — single stack for Docker Compose and Portainer.
#
# Required env:
#   FTP_USERS                username:password
#   FTP_MASQUERADE_ADDRESS   Docker host LAN IPv4
#   IMMICH_API_KEY           Immich API key (asset.upload)
#
# FTPS certificates are auto-generated on first start into the ftp_certs volume
# (SAN = FTP_MASQUERADE_ADDRESS). Optional override:
#   FTP_CERT_PEM / FTP_KEY_PEM
#
# Get the camera trust root after first start:
#   docker exec sony_ftp cat /run/ftp-certs/cacert.pem
#
# Optional:
#   IMMICH_HOST=http://immich-server:2283
#   IMMICH_DOCKER_NETWORK=immich_default
#   IMMICH_ALLOW_HTTP=true
#   FTP_AUTO_GENERATE_CERT=true

name: sony-immich-ingest

services:
  sony-ftp:
    container_name: sony_ftp
    image: ghcr.io/${GHCR_OWNER:-hanevsky}/immich-ftps-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    # Do not cap_drop:ALL here — Portainer/volume mounts need DAC/CHOWN for first start.
    pids_limit: 100
    environment:
      FTP_USERS: ${FTP_USERS:?Set FTP_USERS=username:password}
      FTP_MASQUERADE_ADDRESS: ${FTP_MASQUERADE_ADDRESS:?Set FTP_MASQUERADE_ADDRESS to this Docker host LAN IPv4}
      FTP_CERT_PEM: ${FTP_CERT_PEM:-}
      FTP_KEY_PEM: ${FTP_KEY_PEM:-}
      FTP_AUTO_GENERATE_CERT: ${FTP_AUTO_GENERATE_CERT:-true}
      TZ: ${TZ:-UTC}
    ports:
      - "2121:2121/tcp"
      - "30000-30009:30000-30009/tcp"
    volumes:
      - sony_staging:/srv/ftp/sony
      - ftp_certs:/run/ftp-certs
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    networks:
      - ftp_net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import socket;
          s=socket.create_connection(('127.0.0.1',2121),3);
          ok=s.recv(64).startswith(b'220');s.close();raise SystemExit(0 if ok else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  immich-importer:
    container_name: immich_ftp_importer
    image: ghcr.io/${GHCR_OWNER:-hanevsky}/immich-ftps-importer:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    environment:
      IMMICH_HOST: ${IMMICH_HOST:-http://immich-server:2283}
      IMMICH_API_KEY: ${IMMICH_API_KEY:?Set IMMICH_API_KEY}
      IMMICH_ALLOW_HTTP: ${IMMICH_ALLOW_HTTP:-true}
      IMMICH_CA_CERT_PEM: ${IMMICH_CA_CERT_PEM:-}
      HOME: /tmp/home
      IMMICH_CONFIG_DIR: /tmp/immich-config
      TZ: ${TZ:-UTC}
    volumes:
      - sony_staging:/data:ro
      - importer_state:/state
      - immich_certs:/run/immich-certs
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    networks:
      - immich
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          now=$$(date +%s);
          last=$$(cat /state/last-cycle 2>/dev/null || echo 0);
          test $$((now - last)) -le 240
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  sony_staging:
  importer_state:
  ftp_certs:
  immich_certs:

networks:
  ftp_net:
    driver: bridge
    internal: true
  immich:
    external: true
    name: ${IMMICH_DOCKER_NETWORK:-immich_default}
